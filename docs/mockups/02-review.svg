<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">MuseStation concept 02 — Review and approve</title>
<desc id="desc">An illustrative Muse plan for a falling-block game, with controller choices to approve, add detail, or cancel. The example plan is authored for the mockup, not generated by Muse.</desc>
<defs><radialGradient id="glow"><stop stop-color="#364724"/><stop offset="1" stop-color="#101510"/></radialGradient><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#788b65" stroke-opacity=".08"/></pattern></defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#101510"/>
<ellipse cx="1410" cy="150" rx="710" ry="900" fill="url(#glow)"/>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="url(#grid)"/>
<g transform="translate(64 44) scale(0.65625)"><rect width="64" height="64" rx="15" fill="#d1f37a"/><path d="M13 45V20h6l13 15 13-15h6v25h-7V31L32 44 20 31v14z" fill="#18240e"/></g>
<text x="120" y="76" fill="#f1f4e9" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" letter-spacing="-0.8" text-anchor="start">MuseStation</text>
<text x="335" y="75" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" letter-spacing="1.5" text-anchor="start">MAKE SOMETHING WORTH PLAYING.</text>
<rect x="1295" y="48" width="240" height="36" rx="18" fill="#27341e" stroke="#4d6237"/>
<text x="1312" y="72" fill="#d1f37a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" letter-spacing="0.6" text-anchor="start">HYBRID / MUSE</text>
<path d="M64 116L1536 116" fill="none" stroke="#354332" stroke-width="1"/>
<text x="64" y="158" fill="#d1f37a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" letter-spacing="1.8" text-anchor="start">02 / YOUR CONSOLE. YOUR IDEAS.</text>
<text x="61" y="245" fill="#f1f4e9" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="500" letter-spacing="-2.7" text-anchor="start">A plan before we play.</text>
<text x="65" y="297" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" letter-spacing="0" text-anchor="start">Review the idea. Make it yours. Then press Cross.</text>
<rect x="64" y="349" width="920" height="423" rx="24" fill="#192119" stroke="#354332"/>
<text x="96" y="397" fill="#d1f37a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" letter-spacing="1.8" text-anchor="start">PLAN FROM MUSE</text>
<rect x="789" y="374" width="159" height="36" rx="18" fill="#27341e" stroke="#4d6237"/>
<text x="806" y="398" fill="#d1f37a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" letter-spacing="0.6" text-anchor="start">EXAMPLE PLAN</text>
<text x="96" y="467" fill="#f1f4e9" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" letter-spacing="0" text-anchor="start">Build a falling-block game with a clear board,</text>
<text x="96" y="512" fill="#f1f4e9" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" letter-spacing="0" text-anchor="start">a score display and a next-piece preview.</text>
<text x="96" y="557" fill="#f1f4e9" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" letter-spacing="0" text-anchor="start">Use the D-pad to move and Cross to rotate.</text>
<text x="96" y="602" fill="#f1f4e9" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" letter-spacing="0" text-anchor="start">Add a pause screen and increase the speed</text>
<text x="96" y="647" fill="#f1f4e9" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" letter-spacing="0" text-anchor="start">as the player clears rows.</text>
<path d="M96 685L952 685" fill="none" stroke="#354332" stroke-width="1"/>
<text x="96" y="729" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" letter-spacing="0" text-anchor="start">Native app • compiled on your Docker relay</text>
<rect x="1010" y="349" width="526" height="423" rx="24" fill="#202b1b" stroke="#354332"/>
<text x="1046" y="398" fill="#d1f37a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" letter-spacing="1.8" text-anchor="start">YOU&#x27;RE IN CONTROL</text>
<text x="1046" y="449" fill="#f1f4e9" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start">Nothing builds until you approve</text>
<text x="1046" y="483" fill="#f1f4e9" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start">the plan on your controller.</text>
<rect x="1046" y="532" width="454" height="58" rx="14" fill="#d1f37a"/>
<text x="1070" y="569" fill="#18240e" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" letter-spacing="0" text-anchor="start">×  Approve build</text>
<rect x="1046" y="605" width="454" height="58" rx="14" fill="#212b1f" stroke="#354332"/>
<text x="1070" y="642" fill="#f1f4e9" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" letter-spacing="0" text-anchor="start">□  Add detail</text>
<text x="1069" y="718" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" letter-spacing="0" text-anchor="start">○  Cancel</text>
<path d="M64 835L1536 835" fill="none" stroke="#354332" stroke-width="1"/>
<text x="64" y="870" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" letter-spacing="1.5" text-anchor="start">INTERFACE CONCEPT / SAMPLE DATA</text>
<text x="1536" y="870" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" letter-spacing="1.5" text-anchor="end">NOT A CONSOLE CAPTURE</text>
</svg>
