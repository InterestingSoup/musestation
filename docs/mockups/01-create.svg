<text x="1312" y="72" fill="#d1f37a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" letter-spacing="0.6" text-anchor="start">HYBRID / MUSE</text>
<path d="M64 116L1536 116" fill="none" stroke="#354332" stroke-width="1"/>
<text x="64" y="158" fill="#d1f37a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" letter-spacing="1.8" text-anchor="start">01 / YOUR CONSOLE. YOUR IDEAS.</text>
<text x="61" y="245" fill="#f1f4e9" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="500" letter-spacing="-2.7" text-anchor="start">What should we make?</text>
<text x="65" y="297" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" letter-spacing="0" text-anchor="start">Start small. Give your idea a place to play.</text>
<rect x="64" y="349" width="920" height="423" rx="24" fill="#192119" stroke="#354332"/>
<text x="96" y="395" fill="#d1f37a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" letter-spacing="1.8" text-anchor="start">YOUR IDEA</text>
<rect x="96" y="425" width="856" height="118" rx="16" fill="#111a11" stroke="#546a3d"/>
<text x="124" y="476" fill="#f1f4e9" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="500" letter-spacing="-0.7" text-anchor="start">Make a falling-block game with</text>
<text x="124" y="519" fill="#f1f4e9" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="500" letter-spacing="-0.7" text-anchor="start">a score and a next-piece preview.</text>
<text x="98" y="586" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" letter-spacing="0" text-anchor="start">Type a request, or hold R2 to talk.</text>
