<rect x="1444" y="416" width="26" height="26" rx="5" fill="#a7c5e3"/>
<rect x="1351" y="354" width="26" height="26" rx="5" fill="#a7c5e3"/>
<rect x="1382" y="354" width="26" height="26" rx="5" fill="#a7c5e3"/>
<rect x="1413" y="354" width="26" height="26" rx="5" fill="#e1bda4"/>
<rect x="1382" y="385" width="26" height="26" rx="5" fill="#e1bda4"/>
<rect x="1320" y="416" width="26" height="26" rx="5" fill="#e1bda4"/>
<rect x="1320" y="385" width="26" height="26" rx="5" fill="#e1bda4"/>
<rect x="975" y="471" width="240" height="58" rx="14" fill="#d1f37a"/>
<text x="999" y="508" fill="#18240e" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" letter-spacing="0" text-anchor="start">×  Approve build</text>
<text x="975" y="571" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" letter-spacing="0" text-anchor="start">You approve. Then it builds.</text>
<text x="1490" y="571" fill="#d1f37a" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" letter-spacing="1" text-anchor="end">01 / REVIEW</text>
<path d="M64 695L1536 695" fill="none" stroke="#354332" stroke-width="1"/>
<text x="64" y="730" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" letter-spacing="1.5" text-anchor="start">PROJECT ART / INTERFACE CONCEPT</text>
<text x="1536" y="730" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" letter-spacing="1.5" text-anchor="end">NOT A CONSOLE CAPTURE</text>
