<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">MuseStation concept 03 — Build and deliver</title>
<desc id="desc">A sample build-progress screen showing an approved plan, a relay compile in progress, and pending package verification and installation. Progress and app art are illustrative.</desc>
<defs><radialGradient id="glow"><stop stop-color="#364724"/><stop offset="1" stop-color="#101510"/></radialGradient><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#788b65" stroke-opacity=".08"/></pattern></defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#101510"/>
<ellipse cx="1410" cy="150" rx="710" ry="900" fill="url(#glow)"/>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="url(#grid)"/>
<g transform="translate(64 44) scale(0.65625)"><rect width="64" height="64" rx="15" fill="#d1f37a"/><path d="M13 45V20h6l13 15 13-15h6v25h-7V31L32 44 20 31v14z" fill="#18240e"/></g>
<text x="120" y="76" fill="#f1f4e9" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" letter-spacing="-0.8" text-anchor="start">MuseStation</text>
<text x="335" y="75" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" letter-spacing="1.5" text-anchor="start">MAKE SOMETHING WORTH PLAYING.</text>
<rect x="1295" y="48" width="240" height="36" rx="18" fill="#27341e" stroke="#4d6237"/>
<text x="1312" y="72" fill="#d1f37a" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" letter-spacing="0.6" text-anchor="start">HYBRID / MUSE</text>
<path d="M64 116L1536 116" fill="none" stroke="#354332" stroke-width="1"/>
<text x="64" y="158" fill="#d1f37a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" letter-spacing="1.8" text-anchor="start">03 / YOUR CONSOLE. YOUR IDEAS.</text>
<text x="61" y="245" fill="#f1f4e9" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="500" letter-spacing="-2.7" text-anchor="start">Your idea is taking shape.</text>
<text x="65" y="297" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" letter-spacing="0" text-anchor="start">The relay handles the build. Your console brings it home.</text>
<rect x="64" y="349" width="760" height="423" rx="24" fill="#192119" stroke="#354332"/>
<path d="M112 415L112 706" fill="none" stroke="#48563c" stroke-width="2"/>
<circle cx="112" cy="404" r="22" fill="#334324"/>
<text x="112" y="411" fill="#d1f37a" font-family="monospace" font-size="16" font-weight="500" letter-spacing="0" text-anchor="middle">01</text>
<text x="152" y="405" fill="#f1f4e9" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" letter-spacing="-0.5" text-anchor="start">Plan approved</text>
<text x="152" y="438" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">The reviewed revision is locked.</text>
<circle cx="112" cy="505" r="22" fill="#334324"/>
<text x="112" y="512" fill="#d1f37a" font-family="monospace" font-size="16" font-weight="500" letter-spacing="0" text-anchor="middle">02</text>
<text x="152" y="506" fill="#f1f4e9" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" letter-spacing="-0.5" text-anchor="start">Compiling on your relay</text>
<text x="152" y="539" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">Building the native homebrew package.</text>
<circle cx="112" cy="606" r="22" fill="#232d20"/>
<text x="112" y="613" fill="#b0bea8" font-family="monospace" font-size="16" font-weight="500" letter-spacing="0" text-anchor="middle">03</text>
<text x="152" y="607" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" letter-spacing="-0.5" text-anchor="start">Verify the package</text>
<text x="152" y="640" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">Check its size, hash and title identity.</text>
<circle cx="112" cy="707" r="22" fill="#232d20"/>
<text x="112" y="714" fill="#b0bea8" font-family="monospace" font-size="16" font-weight="500" letter-spacing="0" text-anchor="middle">04</text>
<text x="152" y="708" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500" letter-spacing="-0.5" text-anchor="start">Install and launch</text>
<text x="152" y="741" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">Requires a verified console environment.</text>
<rect x="850" y="349" width="686" height="423" rx="24" fill="#202b1b" stroke="#354332"/>
<text x="887" y="397" fill="#d1f37a" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" letter-spacing="1.8" text-anchor="start">ILLUSTRATIVE APP</text>
<text x="1498" y="398" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" letter-spacing="1.4" text-anchor="end">TINY COUNTER</text>
<rect x="887" y="423" width="611" height="247" rx="15" fill="#111a11" stroke="#415332"/>
<text x="1192" y="576" fill="#d1f37a" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="600" letter-spacing="-6" text-anchor="middle">0042</text>
<text x="1192" y="630" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="1.2" text-anchor="middle">×  ADD ONE     ○  RESET</text>
<text x="887" y="720" fill="#f1f4e9" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" letter-spacing="0" text-anchor="start">Keep MuseStation open through installation.</text>
<text x="887" y="749" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" letter-spacing="0" text-anchor="start">Progress shown here is sample data.</text>
<path d="M64 835L1536 835" fill="none" stroke="#354332" stroke-width="1"/>
<text x="64" y="870" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" letter-spacing="1.5" text-anchor="start">INTERFACE CONCEPT / SAMPLE DATA</text>
<text x="1536" y="870" fill="#b0bea8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" letter-spacing="1.5" text-anchor="end">NOT A CONSOLE CAPTURE</text>
</svg>
