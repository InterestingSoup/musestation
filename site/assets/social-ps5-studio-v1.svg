    <text x="53" y="234" fill="#f1f4e9" font-size="72" font-weight="600" letter-spacing="-3.7">PS5 Homebrew</text>
    <text x="53" y="321" fill="#d1f37a" font-size="72" font-weight="600" letter-spacing="-3.7">Creation Studio.</text>
    <text x="57" y="389" fill="#b0bea8" font-size="24">Local voice. Muse-powered development.</text>
    <text x="57" y="426" fill="#b0bea8" font-size="24">Native app builds on your own server.</text>
    <rect x="56" y="480" width="236" height="40" rx="20" fill="#27341e" stroke="#4d6237"/>
    <text x="76" y="506" fill="#d1f37a" font-size="13" letter-spacing="1.3">EXPERIMENTAL PREVIEW</text>
    <text x="312" y="507" fill="#b0bea8" font-size="17">Console testing ahead.</text>
    <rect x="825" y="160" width="319" height="360" rx="22" fill="#192119" stroke="#4c6338"/>
    <text x="856" y="202" fill="#b0bea8" font-size="12" letter-spacing="1.8">YOUR IDEA. YOUR APPROVAL.</text>
