    <circle cx="879" cy="257" r="20" fill="#d1f37a"/>
    <text x="879" y="263" text-anchor="middle" fill="#18240e" font-size="15" font-weight="600">01</text>
    <text x="918" y="266" fill="#f1f4e9" font-size="25">Describe</text>
    <circle cx="879" cy="345" r="20" fill="#d1f37a"/>
    <text x="879" y="351" text-anchor="middle" fill="#18240e" font-size="15" font-weight="600">02</text>
    <text x="918" y="354" fill="#f1f4e9" font-size="25">Review</text>
    <circle cx="879" cy="433" r="20" fill="#d1f37a"/>
    <text x="879" y="439" text-anchor="middle" fill="#18240e" font-size="15" font-weight="600">03</text>
    <text x="918" y="442" fill="#f1f4e9" font-size="25">Approve</text>
    <path d="M56 565H1144" stroke="#354332"/>
    <text x="56" y="601" fill="#b0bea8" font-size="15">musestation.interestingsoup.com</text>
    <text x="1144" y="601" text-anchor="end" fill="#b0bea8" font-size="12" letter-spacing="1.6">AN INTERESTINGSOUP EXPERIMENT</text>
