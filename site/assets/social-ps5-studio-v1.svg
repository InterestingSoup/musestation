<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MuseStation — PS5 Homebrew Creation Studio</title>
  <desc id="desc">Local voice, Muse-powered development and your own build server. Experimental preview; console testing ahead.</desc>
  <defs>
    <radialGradient id="glow"><stop stop-color="#40532c"/><stop offset="1" stop-color="#101510"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#829c67" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#101510"/>
  <ellipse cx="1110" cy="190" rx="560" ry="600" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g transform="translate(56 48) scale(.75)">
    <rect width="64" height="64" rx="15" fill="#d1f37a"/>
    <path d="M13 45V20h6l13 15 13-15h6v25h-7V31L32 44 20 31v14z" fill="#18240e"/>
  </g>
